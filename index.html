<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b2f4f" />
    <meta name="description" content="iSchool B2B Offline Quality Evaluation Workspace" />
    <title>B2B Offline | iSchool Quality</title>
    <style>
      #boot-screen{min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#0b2f4f}#boot-card{width:min(430px,100%);padding:32px;border:1px solid #dce6f0;border-radius:22px;background:#fff;box-shadow:0 20px 60px rgba(11,47,79,.12);text-align:center}#boot-logo{width:56px;height:56px;display:grid;place-items:center;margin:0 auto 18px;border-radius:17px;background:linear-gradient(145deg,#056fec,#20a2ff);color:#fff;font-weight:900}#boot-title{margin:0 0 8px;font-size:22px}#boot-copy{margin:0;color:#6b7f92;line-height:1.6;font-size:14px}#boot-loader{width:32px;height:32px;margin:22px auto 0;border:3px solid #e6eef6;border-top-color:#056fec;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    </style>
    <script>
      (function(){
        var reloadKey='b2b-latest-bundle-reload';
        function isStaleChunkError(message){
          return /Failed to fetch dynamically imported module|Importing a module script failed|Loading chunk .* failed|ChunkLoadError/i.test(String(message||''));
        }
        function reloadLatestBundle(){
          var previousAttempt=Number(sessionStorage.getItem(reloadKey)||0);
          if(Date.now()-previousAttempt<15000)return false;
          sessionStorage.setItem(reloadKey,String(Date.now()));
          var url=new URL(window.location.href);
          url.searchParams.set('_workspace_refresh',String(Date.now()));
          window.location.replace(url.toString());
          return true;
        }
        window.__b2bBootError=function(message){
          if(isStaleChunkError(message)&&reloadLatestBundle())return;
          var root=document.getElementById('root');
          if(!root)return;
          root.innerHTML='<main id="boot-screen"><section id="boot-card"><div id="boot-logo">iS</div><h1 id="boot-title">Unable to start B2B Offline</h1><p id="boot-copy">'+String(message||'Unexpected browser error').replace(/[<>]/g,'')+'</p><p id="boot-copy" style="margin-top:14px">Reload the page. If it continues, send this message to the platform administrator.</p></section></main>';
        };
        window.addEventListener('error',function(event){window.__b2bBootError(event.message);});
        window.addEventListener('unhandledrejection',function(event){window.__b2bBootError(event.reason&&event.reason.message?event.reason.message:event.reason);});
      })();
    </script>
  </head>
  <body>
    <div id="root"><main id="boot-screen"><section id="boot-card"><div id="boot-logo">iS</div><h1 id="boot-title">B2B Offline Quality</h1><p id="boot-copy">Preparing your secure evaluation workspace…</p><div id="boot-loader"></div></section></main></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
